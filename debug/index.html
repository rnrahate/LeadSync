<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Debug - BuyLead Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-subtle: #fafafa;
            --bg-hover: #f4f4f5;
            --border: #e4e4e7;
            --border-strong: #d4d4d8;
            --text: #18181b;
            --text-2: #52525b;
            --text-3: #a1a1aa;
            --accent: #0d9488;
            --accent-bg: #f0fdfa;
            --success: #059669;
            --success-bg: #ecfdf5;
            --warning: #d97706;
            --warning-bg: #fffbeb;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --purple: #7c3aed;
            --purple-bg: #f5f3ff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-subtle);
            color: var(--text);
            padding: 20px 24px 24px;
            min-height: 100vh;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-icon-img { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; flex-shrink: 0; }
        .header-text { display: flex; flex-direction: column; }
        .header h1 { font-size: 18px; color: var(--text); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
        .header .subtitle { font-size: 11px; color: var(--text-3); margin-top: 2px; }
        .header .status { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
        .header .status #liveIndicator { color: var(--success); font-weight: 600; }

        /* STATS BAR */
        .stats-bar {
            display: flex; gap: 16px; margin-bottom: 10px; padding: 8px 12px;
            background: var(--bg); border-radius: 6px; font-size: 12px; flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        .stats-bar span { color: var(--text-2); }
        .stats-bar strong { color: var(--text); font-variant-numeric: tabular-nums; }

        /* STICKY FILTER BAR */
        .controls {
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            padding: 10px 0; margin-bottom: 12px;
            position: sticky; top: 0; z-index: 100;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border);
        }
        .controls select,
        .controls input {
            padding: 6px 10px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 12px; font-family: inherit;
            transition: border-color 0.12s ease;
        }
        .controls select:focus,
        .controls input:focus {
            outline: none; border-color: var(--text-2);
        }
        .controls button {
            padding: 6px 12px; border: 1px solid transparent; border-radius: 5px;
            cursor: pointer; font-weight: 600; font-size: 12px;
            font-family: inherit; transition: all 0.12s ease;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary   { background: var(--text); color: #fff; }
        .btn-primary:hover:not(:disabled)   { background: #000; }
        .btn-danger    { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
        .btn-danger:hover:not(:disabled)    { background: #fee2e2; }
        .btn-secondary { background: var(--bg); color: var(--text-2); border-color: var(--border); }
        .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }

        /* LOG CONTAINER */
        .log-container {
            background: var(--bg); border-radius: 6px;
            max-height: 74vh; overflow-y: auto;
            border: 1px solid var(--border);
        }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: var(--bg-subtle); }
        .log-container::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        .log-container::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* LOG ROW */
        .log-entry {
            padding: 6px 12px; border-bottom: 1px solid var(--border);
            font-size: 12px; display: flex; align-items: center; gap: 10px;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            flex-wrap: wrap;
        }
        .log-entry:hover { background: var(--bg-subtle); }
        .log-entry:last-child { border-bottom: none; }

        .log-level {
            font-weight: 700; min-width: 55px; text-align: center;
            padding: 1px 6px; border-radius: 3px; font-size: 10px; flex-shrink: 0;
            border: 1px solid transparent;
        }
        .level-TRACE { color: var(--text-3);  background: var(--bg-hover); border-color: var(--border); }
        .level-DEBUG { color: #6366f1;       background: #eef2ff;         border-color: #c7d2fe; }
        .level-INFO  { color: var(--accent);  background: var(--accent-bg); border-color: #99f6e4; }
        .level-WARN  { color: var(--warning); background: var(--warning-bg); border-color: #fde68a; }
        .level-ERROR { color: var(--danger);  background: var(--danger-bg); border-color: #fecaca; }
        .level-FATAL { color: #fff; background: var(--danger); border-color: var(--danger); }

        .log-time { color: var(--text-3); font-size: 11px; min-width: 130px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .log-module { color: var(--text-2); min-width: 85px; flex-shrink: 0; font-size: 11px; font-weight: 500; }
        .log-message { flex: 1; color: var(--text); word-break: break-word; min-width: 200px; }

        .log-extra {
            display: inline-block; color: var(--text-2);
            background: var(--bg-hover); padding: 1px 6px;
            border-radius: 3px; font-size: 10px; margin-left: 6px;
            max-width: 220px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
        }
        .log-reason {
            display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-size: 10px; margin-left: 6px; background: var(--bg-hover);
            font-weight: 600; vertical-align: middle;
        }

        .log-data {
            color: var(--text-3); font-size: 10px; max-width: 260px;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex-shrink: 0;
            font-family: ui-monospace, monospace;
        }
        .log-buttons { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .expand-btn {
            background: none; border: none; color: var(--text-3);
            cursor: pointer; font-size: 10px; padding: 3px 6px;
            border-radius: 3px; transition: color 0.12s ease;
        }
        .expand-btn:hover { background: var(--bg-hover); color: var(--text); }
        .copy-btn {
            background: none; border: none; color: var(--text-3);
            cursor: pointer; font-size: 11px; padding: 3px 6px;
            border-radius: 3px; transition: all 0.12s ease;
        }
        .copy-btn:hover { color: var(--accent); background: var(--bg-hover); }

        .log-data-full {
            display: none; width: 100%; padding: 10px; margin-top: 4px;
            background: var(--bg-subtle); border-radius: 4px;
            font-size: 11px; color: var(--text-2);
            white-space: pre-wrap; word-break: break-all;
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            border-left: 3px solid var(--accent);
        }
        .log-data-full.show { display: block; }

        /* EMPTY */
        .empty {
            text-align: center; color: var(--text-3);
            padding: 60px 20px; font-size: 13px; line-height: 1.6;
        }
        .empty-icon { font-size: 32px; display: block; margin-bottom: 12px; opacity: 0.5; }

        /* FOOTER */
        .footer {
            margin-top: 16px; display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-3); flex-wrap: wrap; gap: 8px;
        }
        .footer a { color: var(--text-2); text-decoration: none; cursor: pointer; font-weight: 500; }
        .footer a:hover { color: var(--text); }

        .credit {
            text-align: center; margin-top: 14px; padding-top: 12px;
            border-top: 1px solid var(--border); font-size: 10px; color: var(--text-3);
        }
        .credit a { color: var(--accent); text-decoration: none; }
        .credit a:hover { text-decoration: underline; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: #fff; padding: 10px 20px;
            border-radius: 5px; font-size: 12px; z-index: 9999;
            max-width: 90%; text-align: center; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(12px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeOutDown {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to   { opacity: 0; transform: translateX(-50%) translateY(12px); }
        }

        @media (max-width: 700px) {
            body { padding: 14px; }
            .controls select, .controls input { font-size: 11px; padding: 5px 8px; }
            .controls button { padding: 5px 10px; font-size: 11px; }
            .log-time { min-width: 100px; font-size: 10px; }
            .log-module { min-width: 70px; }
            .log-data { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../plugin.png" alt="BuyLead Assistant" class="header-icon-img" />
            <div class="header-text">
                <h1>Debug Logs</h1>
                <span class="subtitle">Lead Sync Assistant v6.2.0</span>
            </div>
        </div>
        <div class="status">
            <span id="logCount">0 entries</span>
            <span id="liveIndicator">Live</span>
        </div>
    </div>

    <div class="stats-bar">
        <span>Total: <strong id="statTotal">0</strong></span>
        <span>INFO: <strong id="statInfo">0</strong></span>
        <span>WARN: <strong id="statWarn">0</strong></span>
        <span>ERROR: <strong id="statError">0</strong></span>
        <span>DEBUG: <strong id="statDebug">0</strong></span>
    </div>

    <div class="controls">
        <select id="levelFilter">
            <option value="ALL">All Levels</option>
            <option value="TRACE">TRACE</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
            <option value="FATAL">FATAL</option>
        </select>

        <select id="moduleFilter">
            <option value="ALL">All Modules</option>
        </select>

        <select id="reasonFilter">
            <option value="ALL">All Reasons</option>
        </select>

        <select id="countryFilter">
            <option value="ALL">All Country Events</option>
        </select>

        <input type="text" id="searchFilter" placeholder="Search logs..." style="width:180px;">

        <button class="btn-primary"   id="applyFilter">Apply</button>
        <button class="btn-secondary" id="clearFilter">Clear</button>
        <button class="btn-secondary" id="refreshBtn">Refresh</button>
        <button class="btn-secondary" id="autoRefreshBtn">Pause Auto</button>
        <button class="btn-primary"   id="exportBtn">Export</button>
        <button class="btn-danger"    id="clearBtn">Clear All</button>
    </div>

    <div class="log-container" id="logContainer">
        <div class="empty">
            <span class="empty-icon">...</span>
            Loading logs...
        </div>
    </div>

    <div class="footer">
        <span>Logs stored locally · Max 500 entries · Auto-refresh 1.2s</span>
        <a id="backLink">Back to Dashboard</a>
    </div>

    <div class="credit">
        Developed by <a href="https://leadsync-tau.vercel.app/" target="_blank">Keyn Labs</a> — Debug v6.2.0
    </div>

    <script src="debug.js"></script>
</body>
</html>
